name: iOS native build and tests
on:
  workflow_dispatch:
    inputs:
      tests:
        description: Test scope
        type: choice
        options: [all, unit]
        default: all
        required: true
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-matrix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    if: ${{ github.event.repository.private == false && github.repository == 'KeyAIGit/JFTA-iOS' }}
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(inputs.tests == 'unit' && '[0]' || '[0,1,2,3]') }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      JFTA_TEST_SHARD: ${{ matrix.shard }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify pinned Xcode
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
      - name: Run assigned native acceptance cases
        run: bash scripts/ci_macos.sh "${{ inputs.tests }}"
      - name: Preserve this shard's actual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jfta-acceptance-${{ matrix.shard }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/ci/
          if-no-files-found: warn
          retention-days: 1
