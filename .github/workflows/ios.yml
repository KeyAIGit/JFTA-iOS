name: iOS native build and tests

# Intentionally manual. Uploading source does not consume any runner minutes.
# Public-only job gate avoids consuming paid private-repository minutes.
on:
  workflow_dispatch:
    inputs:
      tests:
        description: 'all = unit plus UI tests; unit = quicker first compiler check'
        required: true
        type: choice
        default: all
        options:
          - all
          - unit

permissions:
  contents: read

concurrency:
  group: jfta-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    # Never allocate a runner if this repository becomes private again.
    if: ${{ github.event.repository.private == false && github.repository == 'KeyAIGit/JFTA-iOS' }}
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      TEST_MODE: ${{ inputs.tests }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify the pinned Xcode installation
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
      - name: Compile and run XCTest on an installed iPhone Simulator
        shell: bash
        run: bash scripts/ci_macos.sh "$TEST_MODE"
      - name: Preserve real test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jfta-ios-evidence-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/ci/
          retention-days: 3
          compression-level: 9
          if-no-files-found: warn
